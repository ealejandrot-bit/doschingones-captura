    var list=wkRows.filter(function(r){return r.suc===s;}).sort(byMonto);var st=list.reduce(function(a,r){return a+r.total;},0);
    var emoji=s==="GARDEN"?"🌿":"🏞️",cls=s==="GARDEN"?"garden":"presa";
    var rows=list.map(function(r){var falta=(r.factura!=="Facturado");
      return '<div class="p'+(falta?" falta":"")+'"><div class="c"><div class="nm">'+r.prov+' <span class="ctag">'+((r.code?r.code+" · ":"")+(r.cuenta||"(sin clasificar)"))+'</span></div><div class="fis">Subtotal '+fz(r.st)+' · IVA '+fz(r.iva)+' · ISR '+fz(r.isr)+' · Desc '+fz(r.de)+'</div></div><div class="mo">'+mx(r.total)+'</div><span class="chip '+(r.pagado==="Pagado"?"pag":"vig")+'" onclick="togP(\''+r.id+'\')">'+(r.pagado==="Pagado"?"✓ Pagado":"● Vigente")+'</span><span class="chip '+(r.factura==="Facturado"?"fac":"nof")+'" onclick="togF(\''+r.id+'\')">'+(r.factura==="Facturado"?"🧾 Facturado":"⚠ "+(r.factura||"No facturado"))+'</span></div>';
    }).join("")||'<div style="padding:16px;color:var(--muted)">Sin pagos esta semana.</div>';
    return '<div class="suc '+cls+'"><h2><span>'+emoji+' '+s+'</span><span class="tt">'+list.length+' pagos</span></h2><div class="pg">'+rows+'</div><div class="tot"><span>TOTAL</span><span>'+mx(st)+'</span></div></div>';
  }).join("");
}
initSat();setLockUI();cargar();
</script></body></html>
