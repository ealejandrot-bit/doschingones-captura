<style>
:root{
  --bg:#FBF3D6; --surface:#FFFFFF; --field:#F4E9BE; --field-2:#EADEAE;
  --ink:#17130C; --ink2:#5A5136; --muted:#AC9F72; --line:#EBDFB2;
  --accent:#D42E22; --accent-d:#A8231A; --navy:#28347A;
  --pend:#AC9F72; --prog:#D98A2B; --cumpl:#2E7D4F; --atras:#D42E22;
  --script:"Anton",Impact,sans-serif; --sans:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px}
.topnav{display:flex;gap:5px;background:var(--field);border-radius:12px;padding:5px;margin-bottom:20px}
.topnav a{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink2);text-decoration:none}
.topnav a.active{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(23,19,12,.14)}
.masthead{margin-bottom:20px}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wordmark{font-family:var(--script);font-size:38px;line-height:.86;color:var(--accent);text-transform:uppercase;text-shadow:2.5px 2.5px 0 var(--ink);margin-top:2px}
.tagline{font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-size:12px;margin-top:6px}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:13px;padding:12px 13px;box-shadow:0 1px 3px rgba(44,40,31,.05);text-align:center}
.kpi .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-top:2px}
.kpi.cumpl .val{color:var(--cumpl)} .kpi.prog .val{color:var(--prog)} .kpi.pend .val{color:var(--pend)} .kpi.atras .val{color:var(--atras)} .kpi.glob .val{color:var(--navy)}
.progGlobal{height:10px;border-radius:6px;background:var(--field-2);overflow:hidden;margin-bottom:18px}
.progGlobal span{display:block;height:100%;background:var(--cumpl);transition:width .3s}

.mode2{display:flex;gap:6px;background:var(--field);border-radius:12px;padding:5px;margin-bottom:16px;max-width:340px}
.mode2 button{flex:1;border:none;background:transparent;color:var(--ink2);font-weight:800;font-size:13.5px;padding:10px;border-radius:9px;cursor:pointer;font-family:var(--sans)}
.mode2 button.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px -3px rgba(212,46,34,.55)}
.epanel{background:var(--surface);border-radius:14px;padding:15px 17px;margin-bottom:14px;box-shadow:0 1px 3px rgba(44,40,31,.05)}
.epanel h3{font-family:var(--script);font-size:19px;text-transform:uppercase;margin:0 0 11px;letter-spacing:.02em}
.prow{display:flex;align-items:center;gap:11px;padding:8px 0}
.prow+.prow{border-top:1px solid #f2ecdd}
.prow .nm{font-weight:700;min-width:80px;font-size:14px}
.pbar{flex:1;height:12px;border-radius:6px;background:var(--field-2);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--cumpl)}
.prow .pp{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.prow .cc{font-size:11px;color:var(--muted);min-width:130px;text-align:right}
.foco{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:13.5px}
.foco+.foco{border-top:1px solid #f2ecdd}
.foco .d{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.foco small{color:var(--muted)}
@media(max-width:720px){.prow .cc{min-width:0;font-size:10px}.prow .nm{min-width:64px}}
.naform-wrap{margin-bottom:14px}
.mini.add{background:var(--navy);color:#fff}
.mini.add.solid{background:var(--accent)}
.naform{background:var(--surface);border-radius:13px;padding:14px 15px;margin-top:10px;box-shadow:0 1px 3px rgba(44,40,31,.06)}
.naform input,.naform select{width:100%;padding:11px 12px;border:none;border-radius:9px;background:var(--field);font-family:var(--sans);font-size:13.5px;color:var(--ink)}
.naform input::placeholder{color:var(--muted)}
.narow{display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;gap:8px;margin-top:9px}
.nabtns{display:flex;gap:8px;margin-top:11px}
.delx{margin-left:auto;background:#fff;border:1.5px solid var(--line);color:var(--atras);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
.delx:hover{background:var(--atras);color:#fff;border-color:var(--atras)}
@media(max-width:640px){.narow{grid-template-columns:1fr 1fr}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:flex;background:var(--field);border-radius:11px;padding:4px}
.seg button{border:none;background:transparent;color:var(--ink2);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(23,19,12,.14)}
select{font-size:13px;font-weight:600;padding:8px 11px;border-radius:9px;border:none;background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,19,12,.08)}
.spacer{flex:1}
.mini{font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface);border:none;padding:8px 12px;border-radius:9px;cursor:pointer;box-shadow:0 1px 3px rgba(23,19,12,.08)}

.group{margin-bottom:22px}
.group-h{display:flex;align-items:center;gap:9px;margin:0 2px 9px}
.group-h .t{font-family:var(--script);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.group-h .c{font-size:12px;color:var(--muted);font-weight:600}
.group-h .pc{margin-left:auto;font-size:12px;font-weight:800;color:var(--navy)}

.card{background:var(--surface);border-radius:13px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px rgba(44,40,31,.05);border-left:5px solid var(--pend)}
.card.prog{border-left-color:var(--prog)} .card.cumpl{border-left-color:var(--cumpl)} .card.atras{border-left-color:var(--atras)}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card .tit{font-weight:700;font-size:14.5px;line-height:1.35}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--field);color:var(--ink2)}
.tag.cat{background:var(--navy);color:#fff} .tag.cat.Sistema{background:#7a5b2b} .tag.cat.León{background:var(--accent)} .tag.cat.Legal{background:#4a4a4a}
.tag.plazo{background:#f0e2c0;color:#8a6a2b}
.resp{margin-top:8px;font-size:12px;color:var(--ink2)}
.resp b{color:var(--ink)}
.nota{margin-top:6px;font-size:12px;color:var(--muted);font-style:italic}
.pct{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.controls{margin-top:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px solid #f2ecdd;padding-top:10px}
.sseg{display:flex;gap:4px;flex-wrap:wrap}
.sseg button{border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-weight:700;font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:var(--sans)}
.sseg button.on.pend{background:var(--pend);color:#fff;border-color:var(--pend)}
.sseg button.on.prog{background:var(--prog);color:#fff;border-color:var(--prog)}
.sseg button.on.cumpl{background:var(--cumpl);color:#fff;border-color:var(--cumpl)}
.sseg button.on.atras{background:var(--atras);color:#fff;border-color:var(--atras)}
.slider{flex:1;min-width:150px;display:flex;align-items:center;gap:9px}
input[type=range]{flex:1;accent-color:var(--cumpl)}
.notein{width:100%;margin-top:9px;padding:9px 11px;border:none;border-radius:9px;background:var(--field);font-family:var(--sans);font-size:12.5px;color:var(--ink)}
.notein::placeholder{color:var(--muted)}
.foot{margin-top:20px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}
/* Marcador de strikes */
.score{background:linear-gradient(135deg,var(--navy),#1c2557);color:#fff;border-radius:15px;padding:15px 17px;margin-bottom:18px;box-shadow:0 6px 20px -10px rgba(40,52,122,.6)}
.score-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.score-h .t{font-family:var(--script);font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.score-h .s{font-size:11px;opacity:.8;font-weight:600}
.sb-row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:9px}
.sb-row+.sb-row{margin-top:3px}
.sb-row.out-row{background:rgba(212,46,34,.28)}
.sb-name{font-weight:700;min-width:84px;font-size:14px}
.balls{display:flex;gap:6px}
.ball{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;background:transparent;transition:.12s;line-height:1}
.ball:hover{border-color:#fff}
.ball.on{background:var(--accent);border-color:var(--accent)}
.out{margin-left:auto;font-weight:800;font-size:11px;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.14);letter-spacing:.04em}
.out.active{background:var(--accent);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
@media(max-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}.wordmark{font-size:32px}.sb-name{min-width:70px;font-size:13px}}
/* Ejecutivo compacto: pelotas + % lado a lado */
.etop{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start;margin-bottom:14px}
.etop>.epanel,.etop>.score{margin-bottom:0}
.score.mini{padding:12px 13px}
.score.mini .score-h{margin-bottom:8px;flex-wrap:wrap}
.score.mini .score-h .t{font-size:15px}
.score.mini .score-h .s{display:none}
.score.mini .sb-row{padding:5px 7px;gap:8px}
.score.mini .sb-name{min-width:58px;font-size:12.5px}
.score.mini .balls{gap:4px}
.score.mini .ball{width:20px;height:20px;font-size:11px;border-width:1.5px}
.score.mini .out{font-size:9.5px;padding:3px 8px}
@media(max-width:720px){.etop{grid-template-columns:1fr}}
/* Marcador combinado: strikes (izq) + avance (der) por persona */
.cbrow{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:9px}
.cbrow+.cbrow{margin-top:3px}
.cbrow.out-row{background:rgba(212,46,34,.28)}
.cbrow .balls{flex:0 0 auto}
.cb-name{font-weight:700;min-width:74px;font-size:14px}
.cb-bar{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;min-width:50px}
.cb-bar span{display:block;height:100%;background:var(--cumpl)}
.cb-pct{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;font-size:14px}
.cb-out{font-weight:800;font-size:10px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.14);letter-spacing:.03em;min-width:34px;text-align:center}
.cb-out.active{background:var(--accent);color:#fff}
@media(max-width:720px){.cb-name{min-width:56px;font-size:13px}.cbrow{gap:8px}.cbrow .ball{width:22px;height:22px;font-size:12px}}
</style>
</head>

  var s=document.createElement("script");
  s.src=SCRIPT_URL+"?"+params+"&callback="+name+"&t="+Date.now();
  s.onerror=function(){ delete window[name]; if(cb)cb(null); };
  document.body.appendChild(s);
  setTimeout(function(){ if(s.parentNode)s.parentNode.removeChild(s); },15000);
}
var editable=false, EDITPIN="";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function persist(tipo,clave,valor){ jsonp_("action=consejo_set&which="+WHICH+"&tipo="+tipo+"&clave="+encodeURIComponent(clave)+"&valor="+encodeURIComponent(JSON.stringify(valor))+"&pin="+encodeURIComponent(EDITPIN), flash); }
function persistDel(tipo,clave){ jsonp_("action=consejo_del&which="+WHICH+"&tipo="+tipo+"&clave="+encodeURIComponent(clave)+"&pin="+encodeURIComponent(EDITPIN), flash); }
function flash(res){ if(res&&res.ok===false)return; var e=$("saveTag"); if(e){ e.textContent="✓ guardado"; e.style.opacity="1"; clearTimeout(window._ft); window._ft=setTimeout(function(){e.style.opacity="0";},1400);} }
function avisoLock(){ alert("Vista de solo lectura.\nToca 🔒 Editar e ingresa el código para poder modificar."); }
function setLockUI(){ var b=$("btnEdit"); if(b) b.textContent = editable ? "🔓 Editando" : "🔒 Editar"; }
window.unlockEdit=function(){
  if(editable){ editable=false; EDITPIN=""; lsSet("dc_editpin",""); setLockUI(); return; }
  var code=prompt("Código de edición del consejo:"); if(code==null||code==="") return;
  jsonp_("action=consejo_check&pin="+encodeURIComponent(code), function(res){
    if(res&&res.ok){ EDITPIN=code; editable=true; lsSet("dc_editpin",code); setLockUI(); }
    else alert("Código incorrecto.");
  });
};

var CUSTOM=[];
var ACUERDOS=SEED.concat(CUSTOM);
function rebuild(){ACUERDOS=SEED.concat(CUSTOM);}

var ESTS={pend:["Pendiente","pend"],prog:["En progreso","prog"],cumpl:["Cumplido","cumpl"],atras:["Atrasado","atras"]};
var ORD_EST=["atras","pend","prog","cumpl"];
var VIEW="estatus";
var $=function(id){return document.getElementById(id)};

var STATE={};
function cur(a){var o=STATE[a.id]||{};return{estatus:o.estatus||a.estatus,avance:(o.avance!=null?o.avance:a.avance),nota:(o.nota!=null?o.nota:a.nota)};}
function persistEstado(id){ for(var i=0;i<ACUERDOS.length;i++){ if(ACUERDOS[i].id===id){ persist("estado",id,cur(ACUERDOS[i])); return; } } }

/* ===== Marcador de strikes (3 = out) ===== */
var SCORE_PEOPLE=["Freddy","Fabián","Jacob","Adrián","Luis","Ortega","Miriam"];
var STRIKES={};
window.setStrike=function(p,n){if(!editable){avisoLock();return;}var c=STRIKES[p]||0;STRIKES[p]=(c===n)?n-1:n;if(STRIKES[p]<0)STRIKES[p]=0;persist("strike",p,STRIKES[p]);renderScore();};
function scoreInner(){
  var rows=SCORE_PEOPLE.map(function(p){
    var n=STRIKES[p]||0, out=n>=3;
    var balls=[1,2,3].map(function(i){return '<div class="ball'+(n>=i?" on":"")+'" onclick="setStrike(\''+p+'\','+i+')">'+(n>=i?"⚾":"")+'</div>';}).join("");
    return '<div class="sb-row'+(out?" out-row":"")+'"><span class="sb-name">'+p+'</span><div class="balls">'+balls+'</div>'+
      '<span class="out'+(out?" active":"")+'">'+(out?"⚾ OUT":n+" / 3")+'</span></div>';
  }).join("");
  return '<div class="score-h"><span class="t">⚾ Marcador — 3 strikes y estás out</span><span class="s">toca las bolitas para marcar</span></div>'+rows;
}
function renderScore(){ $("score").innerHTML=scoreInner(); }
function setField(id,k,v){if(!editable){avisoLock();return;}STATE[id]=STATE[id]||{};STATE[id][k]=v;persistEstado(id);render();}

function personas(){var set={};ACUERDOS.forEach(function(a){a.resp.forEach(function(r){set[r]=(set[r]||0)+1})});return Object.keys(set).sort(function(x,y){return set[y]-set[x]});}

function kpis(){
  var c={pend:0,prog:0,cumpl:0,atras:0},sum=0;
  ACUERDOS.forEach(function(a){var s=cur(a);c[s.estatus]++;sum+=s.avance;});
  var g=Math.round(sum/ACUERDOS.length);
  $("kpis").innerHTML=
   '<div class="kpi"><div class="val">'+ACUERDOS.length+'</div><div class="lbl">Acuerdos</div></div>'+
   '<div class="kpi cumpl"><div class="val">'+c.cumpl+'</div><div class="lbl">Cumplidos</div></div>'+
   '<div class="kpi prog"><div class="val">'+c.prog+'</div><div class="lbl">En progreso</div></div>'+
   '<div class="kpi pend"><div class="val">'+c.pend+'</div><div class="lbl">Pendientes</div></div>'+
   '<div class="kpi glob"><div class="val">'+g+'%</div><div class="lbl">Avance global</div></div>';
  $("progGlobal").style.width=g+"%";
}

function card(a){
  var s=cur(a);
  var btns=Object.keys(ESTS).map(function(k){
    var on=s.estatus===k?(" on "+ESTS[k][1]):"";
    return '<button class="'+ESTS[k][1]+on+'" onclick="setEst(\''+a.id+'\',\''+k+'\')">'+ESTS[k][0]+'</button>';
  }).join("");
  var resp=a.resp.map(function(r){return "<b>"+r+"</b>"}).join(", ");
  return '<div class="card '+s.estatus+'">'+
    '<div class="card-top"><div>'+
      '<div class="tit">'+a.tit+'</div>'+
      '<div class="tags"><span class="tag cat '+a.cat+'">'+a.cat+'</span><span class="tag plazo">🗓 '+a.plazo+'</span></div>'+
      '<div class="resp">👤 '+resp+'</div>'+
      (a.nota?'<div class="nota">'+a.nota+'</div>':'')+
    '</div><div class="pct">'+s.avance+'%</div></div>'+
    '<div class="controls"><div class="sseg">'+btns+'</div>'+
      '<div class="slider"><input type="range" min="0" max="100" step="5" value="'+s.avance+'" oninput="setAv(\''+a.id+'\',this.value)"></div>'+
      (a.id.charAt(0)==="x"?'<button class="delx" onclick="delAcuerdo(\''+a.id+'\')">🗑 Eliminar</button>':'')+
    '</div>'+
    '<input class="notein" placeholder="Nota / evidencia..." value="'+(s.nota||"").replace(/"/g,"&quot;")+'" onchange="setNota(\''+a.id+'\',this.value)">'+
  '</div>';
}
window.setEst=function(id,k){var av=(k==="cumpl")?100:(k==="pend"?0:undefined);setField(id,"estatus",k);if(av!=null)setField(id,"avance",av);};
window.setAv=function(id,v){if(!editable){avisoLock();return;}v=parseInt(v,10);STATE[id]=STATE[id]||{};STATE[id].avance=v;STATE[id].estatus=v>=100?"cumpl":(v<=0?(STATE[id].estatus==="atras"?"atras":"pend"):(STATE[id].estatus==="atras"?"atras":"prog"));persistEstado(id);render();};
window.setNota=function(id,v){setField(id,"nota",v);};
window.toggleForm=function(){if(!editable){avisoLock();return;}var f=$("naform");f.style.display=(f.style.display==="none"?"":"none");};
window.addAcuerdo=function(){
  if(!editable){avisoLock();return;}
  var tit=$("naTit").value.trim(); if(!tit){alert("Escribe el acuerdo.");return;}
  var resp=$("naResp").value.split(",").map(function(s){return s.trim();}).filter(Boolean);
  if(!resp.length)resp=["Por asignar"];
  var est=$("naEst").value, av=est==="cumpl"?100:(est==="pend"?0:20);
  var nuevo={id:"x"+Date.now(),cat:$("naCat").value,tit:tit,resp:resp,plazo:($("naPlazo").value.trim()||"Por definir"),avance:av,estatus:est,nota:""};
  CUSTOM.push(nuevo); persist("custom",nuevo.id,nuevo); rebuild();
  $("naTit").value="";$("naResp").value="";$("naPlazo").value="";
  $("naform").style.display="none";
  render();
};
window.delAcuerdo=function(id){
  if(!editable){avisoLock();return;}
  if(!confirm("¿Eliminar este acuerdo? (solo los que agregaste manualmente)"))return;
  CUSTOM=CUSTOM.filter(function(a){return a.id!==id;});
  persistDel("custom",id); if(STATE[id]){delete STATE[id];persistDel("estado",id);} rebuild(); render();
};

function noCumpl(a){return cur(a).estatus!=="cumpl";}
function CATS(){var seen={},out=[];ACUERDOS.forEach(function(a){if(!seen[a.cat]){seen[a.cat]=1;out.push(a.cat);}});return out;}
function groupBy(){
  var filtro=$("filtro").value;
  if(VIEW==="cumplidos"){
    return [{t:"🏆 Base de cumplidos",items:ACUERDOS.filter(function(a){return cur(a).estatus==="cumpl";})}].filter(function(g){return g.items.length;});
  }
  if(VIEW==="persona"){
    var people=filtro==="__all"?personas():[filtro];
    return people.map(function(p){
      var items=ACUERDOS.filter(function(a){return a.resp.indexOf(p)>-1 && noCumpl(a);});
      return {t:p, items:items};
    }).filter(function(g){return g.items.length;});
  }
  if(VIEW==="cat"){
    var cats=CATS();
    if(filtro!=="__all")cats=[filtro];
    return cats.map(function(c){return {t:c,items:ACUERDOS.filter(function(a){return a.cat===c && noCumpl(a);})}}).filter(function(g){return g.items.length;});
  }
  // por estatus (los cumplidos viven en su propia base)
  var labels={atras:"Atrasados",pend:"Pendientes",prog:"En progreso"};
  var order=["atras","pend","prog"];
  var ests=filtro==="__all"?order:[filtro];
  return ests.map(function(k){return {t:labels[k],items:ACUERDOS.filter(function(a){return cur(a).estatus===k;})}}).filter(function(g){return g.items.length;});
}
var MODE2="exec";
window.setMode2=function(m){MODE2=m;$("mExec").classList.toggle("on",m==="exec");$("mDet").classList.toggle("on",m==="det");$("execView").style.display=m==="exec"?"":"none";$("detView").style.display=m==="det"?"":"none";render();};
function renderExec(){
  var combo=SCORE_PEOPLE.map(function(p){
    var items=ACUERDOS.filter(function(a){return a.resp.indexOf(p)>-1;});
    var av=items.length?Math.round(items.reduce(function(s,a){return s+cur(a).avance;},0)/items.length):null;
    var n=STRIKES[p]||0;
    return {p:p,av:av,n:n,out:n>=3};
  }).sort(function(a,b){return (b.av==null?-1:b.av)-(a.av==null?-1:a.av);});
  var rows=combo.map(function(x){
    var balls=[1,2,3].map(function(i){return '<div class="ball'+(x.n>=i?" on":"")+'" onclick="setStrike(\''+x.p+'\','+i+')">'+(x.n>=i?"⚾":"")+'</div>';}).join("");
    var pct=(x.av==null?"—":x.av+"%"), w=(x.av==null?0:x.av);
    return '<div class="cbrow'+(x.out?" out-row":"")+'">'+
      '<div class="balls">'+balls+'</div>'+
      '<span class="cb-name">'+x.p+'</span>'+
      '<div class="cb-bar"><span style="width:'+w+'%"></span></div>'+
      '<span class="cb-pct">'+pct+'</span>'+
      '<span class="cb-out'+(x.out?" active":"")+'">'+(x.out?"OUT":x.n+"/3")+'</span></div>';
  }).join("");
  var foc=ACUERDOS.map(function(a){return {a:a,s:cur(a)};}).filter(function(o){return o.s.estatus==="atras"||o.s.estatus==="pend";})
     .sort(function(a,b){return (a.s.estatus==="atras"?0:1)-(b.s.estatus==="atras"?0:1);});
  var focos=foc.map(function(o){
    var col=o.s.estatus==="atras"?"var(--atras)":"var(--pend)";
    return '<div class="foco"><span class="d" style="background:'+col+'"></span><div><b>'+o.a.tit+'</b><br><small>'+o.a.resp.join(", ")+' · 🗓 '+o.a.plazo+'</small></div></div>';
  }).join("");
  $("execView").innerHTML=
    '<div class="score"><div class="score-h"><span class="t">⚾ Marcador · strikes y avance</span><span class="s">pelotas a la izquierda · avance a la derecha</span></div>'+rows+'</div>'+
    '<div class="epanel"><h3>🔴 Focos rojos · requieren atención</h3>'+(focos||'<div style="color:var(--muted)">Todo al día 🎉</div>')+'</div>';
}

function render(){
  kpis();
  var _exec=(MODE2==="exec");
  $("score").style.display=_exec?"none":"";
  if(!_exec)renderScore();
  if(_exec){ renderExec(); return; }
  var groups=groupBy();
  $("app").innerHTML=groups.map(function(g){
    var av=g.items.reduce(function(s,a){return s+cur(a).avance;},0)/g.items.length;
    return '<div class="group"><div class="group-h"><span class="t">'+g.t+'</span><span class="c">'+g.items.length+' acuerdo(s)</span><span class="pc">'+Math.round(av)+'% avance</span></div>'+
      g.items.map(card).join("")+'</div>';
  }).join("")||'<div class="foot">Sin acuerdos en este filtro.</div>';
}
function fillFiltro(){
  var sel=$("filtro");sel.innerHTML="";
  var opts=[["__all","— Todos —"]];
  if(VIEW==="persona")personas().forEach(function(p){opts.push([p,p])});
  else if(VIEW==="cat")CATS().forEach(function(c){opts.push([c,c])});
  else if(VIEW==="estatus")[["atras","Atrasados"],["pend","Pendientes"],["prog","En progreso"]].forEach(function(x){opts.push(x)});
  opts.forEach(function(o){var e=document.createElement("option");e.value=o[0];e.textContent=o[1];sel.appendChild(e);});
  sel.style.display=(VIEW==="cumplidos")?"none":"";
}
window.setView=function(v){VIEW=v;$("vEst").classList.toggle("on",v==="estatus");$("vPer").classList.toggle("on",v==="persona");$("vCat").classList.toggle("on",v==="cat");$("vCum").classList.toggle("on",v==="cumplidos");fillFiltro();render();};
window.reset=function(){ cargar(); };  // recargar lo guardado por todos
function cargar(){
  jsonp_("action=consejo_get&which="+WHICH, function(res){
    if(res){ STATE=res.estados||{}; STRIKES=res.strikes||{}; CUSTOM=res.custom||[]; rebuild(); }
    fillFiltro(); render();
  });
}
window.exportar=function(){
  var by={};ACUERDOS.forEach(function(a){var s=cur(a);(by[s.estatus]=by[s.estatus]||[]).push("• "+a.tit+" ("+a.resp.join(", ")+") — "+s.avance+"%"+(s.nota?" · "+s.nota:""));});
  var L={cumpl:"✅ CUMPLIDOS",prog:"🔸 EN PROGRESO",pend:"⚪ PENDIENTES",atras:"🔴 ATRASADOS"};
  var txt="SEGUIMIENTO DE ACUERDOS · DOS CHINGONES\n\n";
  ["atras","pend","prog","cumpl"].forEach(function(k){if(by[k])txt+=L[k]+"\n"+by[k].join("\n")+"\n\n";});
  navigator.clipboard.writeText(txt).then(function(){alert("Resumen copiado — ya puedes pegarlo en WhatsApp.");},function(){prompt("Copia el resumen:",txt);});
};

fillFiltro();render();cargar();
(function(){ var pin=lsGet("dc_editpin"); if(pin){ jsonp_("action=consejo_check&pin="+encodeURIComponent(pin), function(res){ if(res&&res.ok){ EDITPIN=pin; editable=true; setLockUI(); } }); } })();
</script>
</body>
</html>
